#          $ref: '#/components/responses/Unauthorized'
#        '404':
#          $ref: '#/components/responses/NotFound'

  /api/v1/example: # TODO: Delete before releasing
    get:
      tags: [ Unregistered, Users, Ducks ]
      operationId: ExampleRoute
      summary: List examples
      description: Represents an example route.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: The invites to the specified event
#          content:
#            application/json:
#              schema:
#                $ref: '#/components/schemas/InvitePage'
    post:
      tags: [ Add them here ]
      operationId: createExample
      summary: Yea
      description: Yea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamplePost'
      responses:
        '201':
          description: Example created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExampleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'


  /api/v1/ratings:
    get:
      tags: [ Admin, Ducks ]
      operationId: getDuckRatings
      summary: Get a page of duck ratings
      description: Get the ratings for a duck
      responses:
        '200':
          description: The ratings for the specified duck
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RatingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [ Admin, Ducks ]
      operationId: rateDuck
      summary: Create a duck rating
      description: Forcefully make a user rate a duck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ratings'
      responses:
        '201':
          description: Rating created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RatingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/ratings/rank/{duckId}:
    get:
      tags: [ Unregistered, Ducks, Ratings]
      operationId: getDuckRanking
      summary: Get rating score and ranking of a duck
      description: Returns an object containing calculated duck ranking and duck rating score (positive ratings - negative ratings)
      parameters:
        - $ref: '#/components/parameters/DuckId'
      responses:
        '200':
          description: Successfully found duck and its ranking information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuckRanking'

  /api/v1/ratings/ducks/{duckId}:
    get:
      tags: [ Admin, Ducks, Ratings ]
      operationId: getRatingsByDuck
      summary: Get ratings for a duck
      description: Get a page of ratings for the specified duck.
      parameters:
        - $ref: '#/components/parameters/DuckId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: The ratings for the specified duck
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'


  /api/v1/ratings/users/{userId}:
    get:
      tags: [ Admin, Users, Ratings ]
      operationId: getRatingsByUser
      summary: Get ratings by a user
      description: Get a page of ratings created by the specified user.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: The ratings created by the specified user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/ratings/ducks/{duckId}/users/{userId}:
    get:
      tags: [ Admin, Ducks, Users, Ratings ]
      operationId: getDuckRating
      summary: Get a duck rating
      description: Get a specific user's rating for a duck.
      parameters:
        - $ref: '#/components/parameters/DuckId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The rating for the specified duck and user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [ Admin, Ducks, Users, Ratings ]
      operationId: updateDuckRating
      summary: Update a duck rating
      description: Update a user's rating for a duck.
      parameters:
        - $ref: '#/components/parameters/DuckId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '200':
          description: Rating updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [ Admin, Ducks, Users, Ratings ]
      operationId: deleteDuckRating
      summary: Delete a duck rating
      description: Delete a specific user's rating for a duck.
      parameters:
        - $ref: '#/components/parameters/DuckId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Rating deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from the OAuth2 Authorization Code + PKCE flow (with Google, send the ID token; Google's access_token is opaque).

  parameters:
    ExampleId: # TODO: Delete before releasing
      name: exampleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 42
    DuckId:
      name: duckId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 42
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 7
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 7
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    # Used to dictate what users see, different than the base entity declarations below the examples
    ExampleResponse: # TODO delete before releasing
      type: object
      required: [ Attribute2 ]
      properties:
        Attribute2:
          type: string


    PageMeta:
      description: Pagination metadata returned inside each list response's page property.
      type: object
      required: [ size, number, totalElements, totalPages ]
      properties:
        size:
          type: integer
          example: 20
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 3

    ExamplePage:  # TODO: Delete before releasing
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'

    ExamplePatch:  # TODO: Delete before releasing
      type: object
      minProperties: 1
      properties:
        Attribute2:
          type: string
          maxLength: 1000
        Attribute3:
          type: boolean

    ExamplePost: # TODO: Delete before releasing
      type: object
      required: [ Attribute1, Attribute2, Attribute3]
      properties:
        Attribute1:
          type: string
          maxLength: 1000
        Attribute2:
          type: string
          maxLength: 1000
        Attribute3:
          type: boolean

    ExampleObject: # TODO: Delete before releasing
      type: object
      required: [ exampleId, Attribute1, Attribute2, Attribute3 ]
      properties:
        exampleId:
          type: integer
          format: int64
        Attribute1:
          type: integer
          format: int64
        Attribute2:
          type: string
          maxLength: 1000
        Attribute3:
          type: boolean


    Ducks:
      type: object
      required: [ duckId, name, imageLink, description, creatorId, ratingScore, position ]
      properties:
        duckId:
          type: integer
          format: int64
          example: 42
        name:
          type: string
          example: "Suit Duck"
        imageLink:
          type: string
          example: https://.../duck-4x.png
        description:
          type: string
          example: "A duck that is suit colored."
        creatorId:
          type: integer
          format: int64
          example: 7
          description: Represents the user id of the user who created the duck.
        ratingScore:
          type: integer
          format: int64
          example: 132
          description: The current difference between positive and negative ratings.
        position:
          type: integer
          format: int64
          example: 1
          description: The position of the duck in the list of all ducks.

    User:
      type: object
      required: [ userId, username, bio, profilePictureLink, role, oauthSubject ]
      properties:
        userId:
          type: integer
          format: int64
          example: 3
        username:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 1000
        profilePictureLink:
          type: string
          maxLength: 1000
        role:
          $ref: '#/components/schemas/Role'
        oauthSubject:
          type: string
          nullable: true

    Ratings:
      type: object
      required: [ userId, duckId, isPositive]
      properties:
        userId:
          type: integer
          format: int64
          example: 3
        duckId:
          type: integer
          format: int64
          example: 4
        isPositive:
          type: boolean
          example: true
          description: Whether the user liked the duck or not.

    RatingResponse:
      type: object
      required: [ userId, duckId, isPositive ]
      properties:
        userId:
          type: integer
          format: int64
          example: 3
        duckId:
          type: integer
          format: int64
          example: 4
        isPositive:
          type: boolean
          example: true
          description: Whether the user liked the duck or not.

    RatingPage:
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RatingResponse'
        page:
          $ref: '#/components/schemas/PageMeta'

    RatingRequest:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 3
        duckId:
          type: integer
          format: int64
          example: 4
        isPositive:
          type: boolean
          example: true
          description: Whether the user liked the duck or not.

    DuckRanking:
      type: object
      properties:
        duckId:
          type: integer
          format: int64
          example: 4
        score:
          type: integer
          format: int64
          example: 2
        position:
          type: integer
          format: int64
          example: 3

    Comments:
      type: object
      required: [ commentId, userId, duckId, comment ]
      properties:
        commentId:
          type: integer
          format: int64
          example: 42
        userId:
          type: integer
          format: int64
          example: 7
        duckId:
          type: integer
          format: int64
          example: 42
        comment:
          type: string
          maxLength: 1000
          example: "This is a comment."

    Role: # Represents DB enum
      type: string
      enum: [ USER, CULLER, CURATOR, ADMIN ]

    Problem:
      description: RFC 9457 Problem Details. The ONE error body every endpoint returns.
      type: object
      required: [ title, status ]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Workout 42 not found
        instance:
          type: string
          example: /api/v1/workouts/42

  responses:
    BadRequest:
      description: Validation failed or malformed JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: One or more fields failed validation. Check the request against the contract.
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
    Forbidden:
      description: Valid token, but not allowed (for example, not an admin)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
    NotFound:
      description: Doesn't exist, or belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: Workout 42 not found
    InternalError:
      description: Unexpected server error. Your app still needs to show something useful.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Internal Server Error
            status: 500
    Conflict:
      description: The invite conflicts with the current resource state, such as an existing invite.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
