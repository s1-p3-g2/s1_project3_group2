# OpenAPI contract for CST 438 Project 02.
# Render it:   https://editor.swagger.io  (File > Import file, or paste)
# Lint it:     npx @redocly/cli lint docs/openapi.yaml
# Mock it:     npx @stoplight/prism-cli mock docs/openapi.yaml   -> http://127.0.0.1:4010
openapi: 3.0.3

info:
  title: Rate My Duck API
  version: 1.0.0
  description: |
    Users create, view, and rate rubber ducks.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Project 3, Team 02
    url: https://github.com/s1-p3-g2/s1_project3_group2

servers:
  - url: http://localhost:8080
    description: Local (docker compose up)
  - url: https://your-api.example.com
    description: Production (replace in Sprint 3)

# Every endpoint requires a Bearer token unless it overrides this with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Unregistered
    description: Endpoints accessible to all unauthenticated users
  - name: User
    description: Endpoints accessible to all signed-in users
  - name: Culler
    description: Endpoints accessible to all users with the "Culler" role
  - name: Curator
    description: Endpoints accessible to all users with the "Curator" role
  - name: Admin
    description: Endpoints accessible to all users with the Admin role
  - name: Users
    description: Endpoints related to Users
  - name: Ducks
    description: Endpoints related to Ducks
  - name: Ratings
    description: Endpoints related to Ratings
  - name: Comments
    description: Endpoints related to Comments


paths:
#  /auth/me: TODO Revist later when oauth is implemented
#    get:
#      tags: [Registered]
#      operationId: getCurrentUser
#      summary: Get the application account for the authenticated Google identity
#      responses:
