services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ratemyduck
      POSTGRES_USER: ratemyduck
      POSTGRES_PASSWORD: ratemyduck_local
    ports:
      - "5432:5432"
    volumes:
      - ratemyduck_postgres_data:/var/lib/postgresql/data
      - ./local-database.sql:/docker-entrypoint-initdb.d/01-local-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ratemyduck_postgres_data:
